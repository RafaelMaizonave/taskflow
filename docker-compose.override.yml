# Uso local automático do Compose. O Docker Manager da Hostinger lê só docker-compose.yml.
services:
  backend:
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "app.main:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    volumes:
      - ./backend/app:/app/app
  frontend:
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src:ro
